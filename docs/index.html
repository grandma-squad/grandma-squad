<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Studio</title>
<meta name="theme-color" content="#E0603A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squad Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EC; --card:#FFFFFF; --ink:#2A1A26; --muted:#7A6670; --line:#F0DFD0;
  --coral:#E0603A; --coral-ink:#FFFFFF; --plum:#5B2A4E; --mint:#1F9E77; --sun:#F2B33D;
  --danger:#C23B3B; --chip:#FDEBDD; --shadow:0 1px 2px rgba(60,30,20,.06),0 8px 24px rgba(60,30,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1218; --card:#271B23; --ink:#F8EDE6; --muted:#BDA8B2; --line:#3A2A34;
    --coral:#F07A52; --plum:#E6B7D6; --mint:#4CC79F; --chip:#3A2530; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--coral);display:grid;place-items:center;color:#fff;font-family:Fraunces,serif;font-weight:800;font-size:18px}
h1{font-family:Fraunces,serif;font-weight:800;font-size:22px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;padding:9px 0;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--plum);color:var(--bg);border-color:var(--plum)}
.tab .n{opacity:.75;font-weight:600;margin-left:4px}
main{padding:12px 16px;max-width:560px;margin:0 auto}
.day{font-family:Fraunces,serif;font-weight:600;font-size:17px;margin:18px 2px 10px;color:var(--plum)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;border:1px solid var(--line)}
.media{position:relative;background:#000;display:flex;justify-content:center}
.media video{width:100%;max-height:68vh;aspect-ratio:9/16;object-fit:contain;background:#000;display:block}
.media.wide video{aspect-ratio:16/9}
.waiting{aspect-ratio:9/16;max-height:40vh;width:100%;display:grid;place-items:center;background:var(--chip);color:var(--muted);text-align:center;padding:20px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--coral);animation:s 1s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.body{padding:14px 14px 16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:#fff}
.st-review{background:var(--sun);color:#3a2600}.st-generating,.st-publishing{background:var(--plum);color:var(--bg)}
.st-published{background:var(--mint)}.st-failed{background:var(--danger)}.st-rejected{background:var(--muted)}
label.f{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input.t,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:16px}
textarea{min-height:90px;resize:vertical}
.fact{font-size:14px;color:var(--ink);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;border:1px dashed var(--line)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--plum);padding:6px 0}
ol.script{margin:6px 0 0 18px;padding:0;font-size:14px;color:var(--muted)}
ol.script li{margin:4px 0}
.err{color:var(--danger);font-size:13px;margin-top:8px;word-break:break-word}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:13px 10px;font-weight:800;font-size:15px;cursor:pointer;background:var(--chip)}
.btn.primary{background:var(--coral);color:var(--coral-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.links a{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:800;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;font-family:Fraunces,serif;color:var(--ink);font-size:20px;margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,15,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:560px;margin:0 auto}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.sheet h2{font-family:Fraunces,serif;margin:0 0 4px;font-size:20px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:14px}
.sheet .btn{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:30;transition:transform .2s;max-width:90vw}
.toast.show{transform:translateX(-50%)}
.setup{background:var(--card);border-radius:20px;padding:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.setup h2{font-family:Fraunces,serif;margin:0 0 6px}
.setup p{color:var(--muted);font-size:14px;margin:0 0 6px}
.small{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo" aria-hidden="true">GS</div>
    <div><h1>Squad Studio</h1><div class="sub" id="sub">Grandma Squad review</div></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="icon-btn" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="review" aria-selected="true">To review<span class="n" id="nReview"></span></button>
    <button class="tab" role="tab" data-tab="done" aria-selected="false">Done<span class="n" id="nDone"></span></button>
  </div>
</header>
<main id="main"></main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const LS = "squadStudio.v1";
let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e) {}
let state = { tab: "review", days: [], branch: null, pending: {}, loading: false };
let pollTimer = null;

function saveCfg(){ try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch(e) {} }
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms); }
function el(tag, attrs={}, ...kids){
  const n=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==="class") n.className=v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v!==undefined && v!==null && v!==false) n.setAttribute(k, v===true ? "" : v);
  }
  for (const k of kids.flat()) if (k!==null && k!==undefined && k!==false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}

async function gh(path, opts={}){
  const r = await fetch("https://api.github.com"+path, {
    ...opts,
    headers: { "Authorization": "Bearer "+cfg.token, "Accept": opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? {"Content-Type":"application/json"} : {}) },
    cache: "no-store",
  });
  if (r.status === 204) return null;
  if (!r.ok) { const t = await r.text(); throw new Error(r.status+" "+(t.slice(0,160))); }
  return opts.raw ? r.text() : r.json();
}
const R = () => `/repos/${cfg.owner}/${cfg.repo}`;

async function dispatch(workflow, inputs){
  if (!state.branch) state.branch = (await gh(R())).default_branch;
  await gh(`${R()}/actions/workflows/${workflow}/dispatches`, { method:"POST", body: JSON.stringify({ ref: state.branch, inputs }) });
}

function dayLabel(id){
  if (id.startsWith("week-")) return "Weekend video · " + id.replace("week-","").replace("-W"," week ");
  const d = new Date(id+"T12:00:00"); const t = new Date(); t.setHours(12,0,0,0);
  const diff = Math.round((t-d)/86400000);
  if (diff===0) return "Today"; if (diff===1) return "Yesterday"; if (diff===-1) return "Tomorrow";
  return d.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
}

async function load(quiet=false){
  if (!cfg.token) return renderSetup();
  if (state.loading) return; state.loading = true;
  if (!quiet) $("#sub").textContent = "Loading…";
  try {
    let list = [];
    try { list = await gh(`${R()}/contents/data/days`); } catch(e) { if (!String(e.message).startsWith("404")) throw e; }
    const files = list.filter(f => f.name.endsWith(".json")).map(f => f.name.replace(".json",""));
    const daily = files.filter(f => !f.startsWith("week-")).sort().reverse().slice(0, 10);
    const weekly = files.filter(f => f.startsWith("week-")).sort().reverse().slice(0, 3);
    const ids = [...weekly, ...daily];
    const days = await Promise.all(ids.map(async id => {
      try { return JSON.parse(await gh(`${R()}/contents/data/days/${id}.json`, { raw:true })); } catch(e) { return null; }
    }));
    state.days = days.filter(Boolean);
    // drop optimistic states once the server has caught up
    for (const d of state.days) for (const it of d.items) {
      const k = d.id+"#"+it.slot, p = state.pending[k];
      if (p && (it.status !== p.from || Date.now() - p.at > 20*60*1000)) delete state.pending[k];
    }
    $("#sub").textContent = `${cfg.owner}/${cfg.repo}`;
    render();
    schedulePoll();
  } catch(e) {
    $("#sub").textContent = "Couldn't load";
    toast("Load failed: " + e.message, 5000);
  } finally { state.loading = false; }
}

function schedulePoll(){
  clearTimeout(pollTimer);
  const busy = Object.keys(state.pending).length || state.days.some(d => d.items.some(i => ["generating","publishing"].includes(i.status)));
  if (busy) pollTimer = setTimeout(() => load(true), 20000);
}

function effStatus(d, it){ const p = state.pending[d.id+"#"+it.slot]; return p ? p.to : it.status; }

function render(){
  const main = $("#main"); main.replaceChildren();
  let nReview=0, nDone=0;
  const groups = [];
  for (const d of state.days) {
    const items = d.items.filter(it => {
      const s = effStatus(d,it); const isDone = ["published","rejected"].includes(s);
      isDone ? nDone++ : nReview++;
      return state.tab === "done" ? isDone : !isDone;
    });
    if (items.length) groups.push([d, items]);
  }
  $("#nReview").textContent = nReview ? `(${nReview})` : "";
  $("#nDone").textContent = nDone ? `(${nDone})` : "";
  if (!groups.length) {
    main.append(el("div",{class:"empty"},
      el("b",{}, state.tab==="review" ? "All caught up" : "Nothing published yet"),
      state.tab==="review" ? "New videos arrive every morning. You can also make today's batch now from Settings." : "Published videos will show up here with their links."));
    return;
  }
  for (const [d, items] of groups) {
    main.append(el("div",{class:"day"}, dayLabel(d.id)));
    for (const it of items) main.append(card(d, it));
  }
}

function card(d, it){
  const status = effStatus(d, it);
  const key = d.id+"#"+it.slot;
  const busy = ["generating","publishing"].includes(status);
  const media = el("div",{class:"media"+(it.wide?" wide":"")});
  if (status==="generating" || !it.video_url) {
    media.append(el("div",{class:"waiting"}, el("div",{}, el("div",{class:"spin"}), status==="failed" ? "This video didn't finish." : "Grandma is getting ready…", el("div",{class:"small"}, status==="failed" ? "" : "About 5–15 minutes"))));
  } else {
    const v = el("video",{src:localUrl(d,it.video_file), poster:it.poster_file ? localUrl(d,it.poster_file) : "", controls:true, playsinline:true, preload:"none"});
    v.addEventListener("error", () => { if (v.src !== it.video_url) { v.src = it.video_url; v.poster = it.poster_url || ""; } }, { once:true });
    media.append(v);
  }
  const labels = {review:"Ready to review", generating:"Making", publishing:"Publishing", published:"Published", failed:"Needs attention", rejected:"Rejected"};
  const meta = el("div",{class:"meta"},
    el("span",{class:"pill st-"+status}, labels[status]||status),
    it.grandma_name ? el("span",{class:"chip"}, it.grandma_name) : null,
    it.topic ? el("span",{class:"chip"}, it.topic) : null,
    it.duration ? el("span",{class:"chip"}, Math.round(it.duration)+"s") : null);

  const body = el("div",{class:"body"}, meta);
  const title = el("input",{class:"t", value:it.title||"", maxlength:"100", "aria-label":"Title"});
  const caption = el("textarea",{"aria-label":"Instagram caption"}); caption.value = it.caption || "";

  if (["review","failed"].includes(status) && it.video_url) {
    body.append(el("label",{class:"f"},"YouTube title"), title);
    if (it.fact) body.append(el("div",{class:"fact"}, el("b",{},"Fact to check: "), it.fact));
    body.append(el("details",{}, el("summary",{},"Script"),
      it.narration ? el("ol",{class:"script"}, it.narration.map(n => el("li",{}, n))) : null));
  } else if (it.title) {
    body.append(el("div",{style:"font-weight:800;font-size:16px"}, it.title));
    if (it.fact) body.append(el("div",{class:"fact"}, it.fact));
  }
  if (it.error && status==="failed") body.append(el("div",{class:"err"}, it.error));

  if (status==="published" || it.youtube?.url || it.instagram?.url) {
    const links = el("div",{class:"links"});
    if (it.youtube?.url) links.append(el("a",{href:it.youtube.url, target:"_blank", rel:"noopener"}, "Open on YouTube"));
    if (it.instagram?.url) links.append(el("a",{href:it.instagram.url, target:"_blank", rel:"noopener"}, "Open on Instagram"));
    if (it.youtube?.privacy && it.youtube.privacy !== "public") body.append(el("div",{class:"small",style:"margin-top:8px"}, "YouTube kept it "+it.youtube.privacy+" — see setup guide step on API approval."));
    if (links.childNodes.length) body.append(links);
  }

  if (it.posted_by_hand && status==="published") body.append(el("div",{class:"small",style:"margin-top:8px"}, "Posted from your phone ✓"));

  if (["review","failed"].includes(status) && it.video_url) {
    body.append(el("div",{class:"actions"},
      el("button",{class:"btn primary", disabled:busy, onclick:()=>postSheet(d,it,title,caption)}, "Save & post"),
      el("button",{class:"btn", onclick:()=>redoSheet(d,it)}, "Redo"),
      el("button",{class:"btn ghost", onclick:()=>setStatus(d,it,"rejected")}, "Reject")));
  } else if (status==="failed") {
    body.append(el("div",{class:"actions",style:"grid-template-columns:1fr"}, el("button",{class:"btn primary", onclick:()=>redoSheet(d,it)}, "Make it again")));
  } else if (status==="rejected") {
    body.append(el("div",{class:"actions",style:"grid-template-columns:1fr 1fr"},
      el("button",{class:"btn", onclick:()=>setStatus(d,it,"review")}, "Undo reject"),
      el("button",{class:"btn", onclick:()=>redoSheet(d,it)}, "Redo")));
  }
  return el("div",{class:"card"}, media, body);
}

function openSheet(...kids){
  const sh=$("#sheet"); sh.replaceChildren(...kids);
  $("#sheetBg").classList.add("open"); requestAnimationFrame(()=>sh.classList.add("open"));
}
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetBg").classList.remove("open"); }
$("#sheetBg").onclick = closeSheet;

function mark(d,it,to){ state.pending[d.id+"#"+it.slot] = { from: it.status, to, at: Date.now() }; render(); schedulePoll(); }

function localUrl(d, file){ return file ? `media/${d.id}/${file}` : ""; }

async function getVideoFile(d, it){
  for (const url of [localUrl(d,it.video_file), it.video_url]) {
    try { const r = await fetch(url, { cache:"no-store" }); if (r.ok) { const b = await r.blob(); if (b.size > 10000) return new File([b], `grandma-squad-${d.id}-${it.slot}.mp4`, { type:"video/mp4" }); } } catch(e) {}
  }
  return null;
}

async function copy(text, what){
  try { await navigator.clipboard.writeText(text); toast(what+" copied"); }
  catch(e){ toast("Couldn't copy — long-press the text instead"); }
}

function postSheet(d,it,title,caption){
  const titleTxt = () => title.value.trim() || it.title || "";
  const capTxt = () => caption.value.trim() || it.caption || "";
  const descTxt = () => (it.description || "");
  let file = null;
  const shareBtn = el("button",{class:"btn primary"}, "Get video");
  shareBtn.onclick = async () => {
    if (file) {  // second tap: share straight away (Safari needs a fresh tap)
      try { await navigator.share({ files:[file], title: titleTxt() }); } catch(e){ if (e.name !== "AbortError") toast("Sharing failed: "+e.message, 4000); }
      return;
    }
    shareBtn.disabled = true; shareBtn.textContent = "Getting video…";
    file = await getVideoFile(d, it);
    shareBtn.disabled = false;
    if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
      shareBtn.textContent = "Save or share video";
    } else {
      shareBtn.textContent = "Open video";
      shareBtn.onclick = () => window.open(it.video_url.split("?")[0], "_blank");
      toast("Open the video, then use the Share button to save it");
    }
  };
  const kids = [
    el("h2",{},"Save & post"),
    el("p",{},"Save the video (Share → Save Video), then post it as a Short in the YouTube app. The buttons copy the title and description to paste."),
    shareBtn,
    el("div",{class:"row"},
      el("button",{class:"btn", onclick:()=>copy(titleTxt(),"Title")}, "Copy title"),
      el("button",{class:"btn", onclick:()=>copy(descTxt(),"Description")}, "Copy description")),
    el("button",{class:"btn", style:"background:var(--mint);color:#fff", onclick:()=>{ closeSheet(); setStatus(d,it,"published"); }}, "I've posted it ✓"),
  ];
  if (cfg.apiPublish) kids.push(el("button",{class:"btn ghost", onclick:()=>{ closeSheet(); publishSheet(d,it,title,caption); }}, "Auto-publish with APIs instead"));
  kids.push(el("button",{class:"btn ghost", onclick:closeSheet}, "Close"));
  openSheet(...kids);
}

function publishSheet(d,it,title,caption){
  const go = async (targets) => {
    closeSheet();
    try {
      await dispatch("publish.yml", { id:d.id, slot:String(it.slot), targets,
        title: title.value.trim() !== (it.title||"") ? title.value.trim() : "",
        caption: caption.value.trim() !== (it.caption||"").trim() ? caption.value.trim() : "" });
      mark(d,it,"publishing"); toast("Publishing… usually 2–5 minutes");
    } catch(e){ toast("Couldn't start: "+e.message, 5000); }
  };
  openSheet(el("h2",{},"Publish this video?"), el("p",{}, it.title || ""),
    el("button",{class:"btn primary", onclick:()=>go("youtube")}, "Publish to YouTube"),
    el("button",{class:"btn ghost", onclick:closeSheet}, "Cancel"));
}

function redoSheet(d,it){
  const note = el("textarea",{placeholder:"Optional: what should change? e.g. “make it about rainbows” or “show her baking instead”"});
  openSheet(el("h2",{}, "Make a new version"), el("p",{}, `${it.grandma_name||"Grandma"} keeps her spot; script, pictures and voice are made fresh.`),
    note,
    el("button",{class:"btn primary", onclick: async()=>{
      closeSheet();
      if (d.kind === "weekly") {
        try { await dispatch("weekly.yml", { include_unpublished: "false" }); mark(d,it,"generating"); toast("Rebuilding the weekend video…"); } catch(e){ toast("Couldn't start: "+e.message,5000); }
        return;
      }
      try { await dispatch("redo.yml", { date:d.id, slot:String(it.slot), note: note.value.trim() }); mark(d,it,"generating"); toast("Making a new version… about 10 minutes"); }
      catch(e){ toast("Couldn't start: "+e.message, 5000); }
    }}, "Redo video"),
    el("button",{class:"btn ghost", onclick:closeSheet}, "Cancel"));
}

async function setStatus(d,it,status){
  try { await dispatch("status.yml", { id:d.id, slot:String(it.slot), status }); mark(d,it,status); toast({rejected:"Rejected", published:"Marked as posted ✓", review:"Back in review"}[status]); }
  catch(e){ toast("Couldn't update: "+e.message, 5000); }
}

function settingsSheet(){
  openSheet(el("h2",{},"Settings"),
    el("p",{}, `Connected to ${cfg.owner}/${cfg.repo}`),
    el("button",{class:"btn primary", onclick: async()=>{ closeSheet(); try { await dispatch("daily.yml", { date:"" }); toast("Making today's videos… they'll appear in about 15 minutes"); setTimeout(()=>load(true), 60000); } catch(e){ toast("Couldn't start: "+e.message,5000);} }}, "Make today's videos now"),
    el("button",{class:"btn", onclick: async()=>{ closeSheet(); try { await dispatch("weekly.yml", { include_unpublished:"false" }); toast("Building this week's video from published Shorts…"); } catch(e){ toast("Couldn't start: "+e.message,5000);} }}, "Build weekend video now"),
    el("button",{class:"btn", onclick:()=>{ window.open(`https://github.com/${cfg.owner}/${cfg.repo}/actions`, "_blank"); }}, "See run history on GitHub"),
    el("button",{class:"btn ghost", onclick:()=>{ cfg.apiPublish=!cfg.apiPublish; saveCfg(); closeSheet(); toast(cfg.apiPublish ? "Auto-publish option turned on" : "Auto-publish option turned off"); }}, cfg.apiPublish ? "Turn off API auto-publish (advanced)" : "Turn on API auto-publish (advanced)"),
    el("button",{class:"btn ghost", onclick:()=>{ if(confirm("Disconnect this phone? You'll need the token again.")){ cfg={}; saveCfg(); closeSheet(); renderSetup(); } }}, "Disconnect"),
    el("button",{class:"btn ghost", onclick:closeSheet}, "Close"));
}

function renderSetup(){
  $("#sub").textContent = "Connect your channel";
  const owner = el("input",{class:"t", placeholder:"GitHub username", autocapitalize:"off", autocorrect:"off", value: cfg.owner||""});
  const repo = el("input",{class:"t", placeholder:"grandma-squad", autocapitalize:"off", autocorrect:"off", value: cfg.repo||"grandma-squad"});
  const token = el("input",{class:"t", placeholder:"github_pat_…", type:"password", autocapitalize:"off", autocorrect:"off"});
  const guess = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  if (!owner.value && guess) owner.value = guess;
  const btn = el("button",{class:"btn primary", style:"width:100%;margin-top:14px", onclick: async()=>{
    cfg = { owner: owner.value.trim(), repo: repo.value.trim(), token: token.value.trim() };
    btn.disabled = true; btn.textContent = "Checking…";
    try { const info = await gh(R()); state.branch = info.default_branch; saveCfg(); toast("Connected!"); load(); }
    catch(e){ toast("That didn't work: "+e.message, 5000); btn.disabled=false; btn.textContent="Connect"; }
  }}, "Connect");
  $("#main").replaceChildren(el("div",{class:"setup"},
    el("h2",{},"Welcome to Squad Studio"),
    el("p",{},"Review each morning's Grandma Squad videos and publish them with one tap."),
    el("label",{class:"f"},"GitHub username"), owner,
    el("label",{class:"f"},"Repository name"), repo,
    el("label",{class:"f"},"Access token"), token,
    el("div",{class:"small",style:"margin-top:6px"},"Fine-grained token for this repository only, with Actions: read & write and Contents: read. It is stored only on this phone."),
    btn));
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  state.tab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x===t)));
  render();
});
$("#refresh").onclick = () => cfg.token ? load() : renderSetup();
$("#openSettings").onclick = () => cfg.token ? settingsSheet() : renderSetup();
document.addEventListener("visibilitychange", () => { if (!document.hidden && cfg.token) load(true); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
</body>
</html>
