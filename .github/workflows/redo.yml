name: Redo one video
on:
  workflow_dispatch:
    inputs:
      date: { description: "Day (YYYY-MM-DD)", required: true }
      slot: { description: "Video number (1, 2 or 3)", required: true }
      note: { description: "Optional instruction, e.g. make it about rain", required: false, default: "" }
permissions:
  contents: write
run-name: Redo ${{ inputs.date }} video ${{ inputs.slot }}
jobs:
  redo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt
      - name: Remake the video
        env:
          NOTE: ${{ inputs.note }}
        run: python -m pipeline.generate_day --date "${{ inputs.date }}" --slots "${{ inputs.slot }}" --note "$NOTE"
  app:
    needs: redo
    if: always()
    uses: ./.github/workflows/deploy-app.yml
    permissions:
      contents: read
      pages: write
      id-token: write
